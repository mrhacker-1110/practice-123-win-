{% extends 'warehouse/base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<section class="panel legal-panel">
    <p class="eyebrow">{{ ui.brand }}</p>
    <h1>{{ title }}</h1>
    <div class="legal-sections">
        {% for heading, body in sections %}
        <section>
            <h2>{{ heading }}</h2>
            <p>{{ body }}</p>
        </section>
        {% endfor %}
    </div>
</section>
{% endblock %}
