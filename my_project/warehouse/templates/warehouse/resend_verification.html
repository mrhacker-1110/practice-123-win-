{% extends 'warehouse/base.html' %}

{% block title %}{{ ui.send_confirmation }}{% endblock %}

{% block content %}
<section class="panel login-panel">
    <p class="eyebrow">{{ ui.brand }}</p>
    <h1>{{ ui.send_confirmation }}</h1>
    <p>{{ ui.resend_help }}</p>
    <form method="post">
        {% csrf_token %}
        <div class="field">
            <label for="verification-email">{{ ui.email }}</label>
            <input id="verification-email" name="email" type="email" required autocomplete="email">
        </div>
        <button type="submit" class="btn btn-primary">{{ ui.send_confirmation }}</button>
    </form>
</section>
{% endblock %}
